<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador de Seguros de Auto</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor Principal en Dos Columnas -->
    <div class="w-full max-w-5xl bg-white rounded-2xl shadow-2xl overflow-hidden grid grid-cols-1 lg:grid-cols-12 items-stretch">
        
        <!-- COLUMNA IZQUIERDA: Dinámica (Cambia título e imagen según la cotización) -->
        <div class="hidden lg:flex lg:col-span-5 bg-indigo-900 flex-col justify-between p-8 text-white relative overflow-hidden">
            <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:16px_16px]"></div>
            
            <div class="relative z-10">
                <span id="tag-izq" class="bg-indigo-700 text-indigo-200 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider inline-block">
                    Seguridad y Confianza
                </span>
                <h1 id="titulo-izq" class="text-2xl font-extrabold mt-3 leading-tight">
                    Protege tu vehículo al instante
                </h1>
                <p id="subtitulo-izq" class="text-indigo-200 mt-2 text-xs leading-relaxed">
                    Calcula tu tarifa personalizada en pocos clics con la mejor cobertura del mercado.
                </p>
            </div>

            <!-- Imagen del vehículo dinámico -->
            <div class="relative z-10 my-4 flex justify-center">
                <img id="imagen-auto" 
                     src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?q=80&w=800&auto=format&fit=crop" 
                     alt="Auto Seguro" 
                     class="rounded-xl shadow-lg object-cover max-h-52 w-full transition-all duration-500">
            </div>

            <div class="relative z-10 text-[11px] text-indigo-300">
                © 2026 PractFun Cotizador. Todos los derechos reservados.
            </div>
        </div>

        <!-- COLUMNA DERECHA: Formulario + Resumen Compacto (Sin Imagen) -->
        <div class="lg:col-span-7 p-6 sm:p-8 flex flex-col justify-between">
            <div>
                <div class="text-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800">Cotiza tu Seguro de Auto</h2>
                    <p class="text-xs text-gray-500">Completa los datos para calcular tu tarifa</p>
                </div>

                <!-- Formulario de Cotización -->
                <form id="cotizar-seguro" class="space-y-3">
                    
                    <!-- Marca del vehículo -->
                    <div>
                        <label for="marca" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Marca del Vehículo:</label>
                        <select id="marca" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-xs text-gray-800 focus:ring-2 focus:ring-indigo-600 focus:outline-none">
                            <option value="">-- Seleccione --</option>
                            <option value="1">Americano (+15%)</option>
                            <option value="2">Asiático (+5%)</option>
                            <option value="3">Europeo (+35%)</option>
                        </select>
                    </div>

                    <!-- Año del modelo -->
                    <div>
                        <label for="year" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Año del Modelo:</label>
                        <select id="year" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-xs text-gray-800 focus:ring-2 focus:ring-indigo-600 focus:outline-none">
                            <option value="">-- Seleccione --</option>
                        </select>
                    </div>

                    <!-- Tipo de Cobertura -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Tipo de Cobertura:</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="border border-gray-200 rounded-xl p-2.5 flex flex-col cursor-pointer hover:border-indigo-600 transition">
                                <div class="flex items-center justify-between">
                                    <span class="font-semibold text-xs text-gray-800">Básico</span>
                                    <input type="radio" name="tipo" value="basico" class="text-indigo-600 focus:ring-indigo-500">
                                </div>
                                <span class="text-[10px] text-gray-500 mt-0.5">Daños a terceros y viales.</span>
                            </label>
                            <label class="border border-gray-200 rounded-xl p-2.5 flex flex-col cursor-pointer hover:border-indigo-600 transition">
                                <div class="flex items-center justify-between">
                                    <span class="font-semibold text-xs text-gray-800">Completo</span>
                                    <input type="radio" name="tipo" value="completo" class="text-indigo-600 focus:ring-indigo-500">
                                </div>
                                <span class="text-[10px] text-gray-500 mt-0.5">Cobertura total y asistencia 24/7.</span>
                            </label>
                        </div>
                    </div>

                    <!-- Spinner HTML -->
                    <div id="cargando" class="spinner" style="display: none;">
                        <div class="rect1"></div>
                        <div class="rect2"></div>
                        <div class="rect3"></div>
                        <div class="rect4"></div>
                        <div class="rect5"></div>
                    </div>

                    <!-- Botón de Envío -->
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl transition duration-200 shadow-md text-xs uppercase tracking-wider font-bold mt-2">
                        Cotizar Seguro Ahora
                    </button>

                </form>
            </div>

            <!-- Contenedor de Alertas / Resumen Compacto -->
            <div id="resultado" class="mt-3"></div>
        </div>

    </div>

    <!-- Script principal -->
    <script src="js/app.js"></script>
</body>
</html>
